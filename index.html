<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Globe</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%230f1a2b%22 stroke=%22%23e2b35f%22 stroke-width=%222%22/%3E%3Cpath d=%22M6 13c5 3 9-4 14 0s4 5 6 3%22 fill=%22none%22 stroke=%22%23e2b35f%22 stroke-width=%222%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>
    <div id="loading">Loading history…</div>
    <div id="toolbar">
      <div id="search"></div>
      <div class="toggles">
        <button id="scheme-toggle" class="toggle" aria-pressed="false">Colours: Map</button>
        <button id="far-toggle" class="toggle" aria-pressed="false" title="Show the other side of the world">Far side</button>
      </div>
    </div>
    <div id="far-side" hidden>
      <div class="far-map" title="The other side of the world — click to flip"></div>
      <span class="far-caption">Far side</span>
    </div>
    <aside id="info" hidden></aside>
    <footer id="timeline"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
